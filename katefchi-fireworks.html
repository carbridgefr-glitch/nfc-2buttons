<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Links</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fff5f7 0%, #f9f9ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #111;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 26px;
      padding: 28px 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .hero {
      margin-bottom: 20px;
    }

    .hero-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.92rem;
      color: #666;
      line-height: 1.5;
    }

    .section-label {
      font-size: 0.75rem;
      color: #999;
      margin: 18px 0 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .button {
      display: block;
      width: 100%;
      text-decoration: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      transition: all 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .site-button {
      background: linear-gradient(135deg, #ff7aa2, #ffb6c1);
      color: #fff;
      box-shadow: 0 6px 18px rgba(255, 122, 162, 0.3);
    }

    .review-button {
      background: #111;
      color: #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }

    .footer {
      margin-top: 24px;
      font-size: 0.72rem;
      color: #888;
    }

    .footer-brand {
      margin-bottom: 8px;
    }

    .footer-link {
      display: inline-block;
      text-decoration: none;
      color: #666;
      border: 1px solid #ddd;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.7rem;
    }

    .footer-link:hover {
      background: #f3f3f3;
      color: #111;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="hero">
      <div class="hero-icon">🎉</div>
      <div class="title">Όλα για τις ξεχωριστές στιγμές σας</div>
      <div class="subtitle">
        Μπαλόνια • Πυροτεχνήματα • Εκδηλώσεις<br>
        Επιλέξτε παρακάτω για περισσότερα
      </div>
    </div>

    <div class="section-label">Ιστοσελίδες</div>

    <a class="button site-button" href="https://mpouketoballoon.gr/">
      🎈 Κατ'Ευχήν Μπουκέτο Μπαλόνια
    </a>

    <a class="button site-button" href="https://fire-fireworks.gr/">
      🎆 Fire Fireworks
    </a>

    <div class="section-label">Αξιολογήσεις</div>

    <a class="button review-button" href="https://www.google.com/search?hl=fr-GR&gl=gr&q=%CE%9A%CE%B1%CF%84%27%CE%95%CF%85%CF%87%CE%AE%CE%BD+%CE%9C%CF%80%CE%BF%CF%85%CE%BA%CE%AD%CF%84%CE%BF+%CE%9C%CF%80%CE%B1%CE%BB%CF%8C%CE%BD%CE%B9%CE%B1,+Leof.+Geor.+Papandreou+85,+Patra+262+26&ludocid=2380302642113183496&lsig=AB86z5VCQG-M1wOga1K7b_MbIrck#lrd=0x135e375d3c434137:0x210888a441147f08,3">
      ★ Αφήστε αξιολόγηση για Κατ'Ευχήν
    </a>

    <a class="button review-button" href="https://www.google.com/search?hl=fr-GR&gl=gr&q=Fire+Fireworks&ludocid=16308254724982585681#lrd=0x135e37ff8f638999:0xe2528f447d2c3951,3">
      ★ Αφήστε αξιολόγηση για Fire Fireworks
    </a>

    <div class="footer">
      <div class="footer-brand">Powered by NFC Μπρελόκ • Jewel Art</div>
      <a class="footer-link" href="https://www.instagram.com/lazaros_jewelart">
        Instagram
      </a>
    </div>

  </div>

</body>
</html>
