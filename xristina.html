<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Μενού & Κριτική</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f6f7fb}
    .wrap{max-width:560px;margin:0 auto;padding:22px}
    .card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.10)}
    h1{font-size:22px;margin:0 0 8px}
    p{margin:0 0 16px;color:#444;line-height:1.45}
    a.btn{display:block;text-decoration:none;text-align:center;padding:16px 14px;border-radius:12px;font-size:18px;margin:12px 0}
    .primary{background:#111;color:#fff}
    .secondary{background:#fff;color:#111;border:2px solid #111}
    .small{font-size:13px;color:#666;margin-top:12px}

    .brand-wrap{margin-top:16px;padding-top:12px;border-top:1px solid #eee;text-align:center}
    .brand{font-size:12px;color:#777;line-height:1.4}
    .brand a{
      display:inline-block;
      margin-top:6px;
      font-size:12px;
      text-decoration:none;
      color:#111;
      border:1px solid #ddd;
      padding:8px 10px;
      border-radius:999px;
      background:#fff;
    }
    .brand a:hover{border-color:#bbb}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Τι θα θέλατε να κάνετε;</h1>
      <p>Πατήστε μία επιλογή:</p>

      <!-- 1ο κουμπί: Site -->
      <a class="btn primary" href="https://xristina-arvaniti.gr/" rel="noopener">
        Επισκεφθείτε το site
      </a>

      <!-- 2ο κουμπί: Google Review -->
      <a class="btn secondary" href="https://search.google.com/local/writereview?placeid=ChIJmbCn7xQ3XhMRGlXfR1-2l94" rel="noopener">
        Αφήστε κριτική στο Google
      </a>

      <div class="small">
        Αν ζητήσει σύνδεση σε Google, είναι φυσιολογικό.
      </div>

      <div class="brand-wrap">
        <div class="brand">
          Powered by NFC Smart Brelok • Jewel Art
          <br />
          <a href="https://www.instagram.com/lazaros_jewelart" rel="noopener">
            @lazaros_jewelart
          </a>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
