<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lázaros Andreas</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --gold1: #d4af37;
      --gold2: #b8891d;
      --gold3: #f2d675;
      --text: #1f2937;
      --muted: #6b7280;
      --bg1: #f8f6f0;
      --bg2: #ffffff;
      --card: rgba(255, 255, 255, 0.97);
      --shadow: 0 18px 45px rgba(60, 45, 10, 0.14);
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--text);
      min-height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border-radius: 28px;
      padding: 34px 20px 22px;
      box-shadow: var(--shadow);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.9);
      backdrop-filter: blur(6px);
    }

    .logo-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold1) 0%, var(--gold3) 100%);
      margin: 0 auto 16px;
      box-shadow: 0 0 0 8px rgba(212, 175, 55, 0.12);
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111827;
      font-family: "Georgia", "Times New Roman", serif;
    }

    .brand-line {
      margin-top: 10px;
      font-size: 18px;
      line-height: 1.4;
      color: #374151;
      font-family: "Georgia", "Times New Roman", serif;
      font-weight: 600;
    }

    .since {
      margin-top: 6px;
      margin-bottom: 26px;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 62px;
      margin: 12px 0;
      padding: 16px 18px;
      border-radius: 18px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .button:active {
      transform: scale(0.99);
    }

    .button-gold {
      background: linear-gradient(180deg, var(--gold3) 0%, var(--gold1) 45%, var(--gold2) 100%);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(184, 137, 29, 0.28);
    }

    .icon {
      font-size: 21px;
      line-height: 1;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #edf0f5;
      font-size: 12px;
      line-height: 1.7;
      color: var(--muted);
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 28px;
      }

      .brand-line {
        font-size: 16px;
      }

      .button {
        font-size: 17px;
        min-height: 58px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-dot"></div>

    <h1>Lázaros Andreas</h1>
    <div class="brand-line">Jewel Art Engraving and Jewel Art</div>
    <div class="since">East 2022</div>

    <a
      class="button button-gold"
      href="https://www.tiktok.com/@car_bridge.gr?_r=1&_t=ZN-95duJlmdar8"
      aria-label="Βρες μας στο TikTok"
    >
      <span class="icon">🎵</span>
      <span>Βρες μας στο TikTok</span>
    </a>

    <a
      class="button button-gold"
      href="https://www.instagram.com/lazaros_jewelart?igsh=M21zdWRva2puN3Rz"
      aria-label="Βρες μας στο Instagram"
    >
      <span class="icon">📸</span>
      <span>Βρες μας στο Instagram</span>
    </a>

    <div class="footer">
      Powered by NFC Brelok • Jewel Art<br>
      <a href="https://www.instagram.com/lazaros_jewelart">Instagram</a>
    </div>
  </main>
</body>
</html>
